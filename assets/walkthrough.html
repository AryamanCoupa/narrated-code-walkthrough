<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><link rel="icon" href="data:,"><title>Code walkthrough</title><style>__STYLE__</style></head><body>
<a class="skip" href="#main">Skip to explanation</a>
<aside class="sidebar"><div class="brand">CODE WALKTHROUGH</div><h2 id="guide-title"></h2><p id="audience" class="tiny subtle"></p><nav id="nav" class="lessons" aria-label="Chapters"></nav><div class="sidebar-bottom"><div id="progress" class="tiny subtle"></div><button class="text-button" id="reset">Reset reading progress</button></div></aside>
<div class="workspace"><header class="topbar"><span id="snapshot" class="tag"></span><div class="top-actions"><button class="btn" id="theme">Dark mode</button><button class="btn" id="browse">Browse source files</button></div></header><main id="main" class="page" tabindex="-1"></main></div>
<section id="player" class="narration-bar" aria-label="Narration"><div class="voice-copy"><strong id="track-title"></strong><small id="track-time"></small><small id="follow-label"></small></div><audio id="audio" controls preload="none" aria-label="Chapter narration"></audio><div class="voice-tools"><button class="btn" id="replay">Replay</button><label class="tiny" for="speed">Speed</label><select id="speed"><option value="0.8">0.8×</option><option value="1">1×</option><option value="1.15" selected>1.15×</option><option value="1.3">1.3×</option><option value="1.5">1.5×</option></select><button class="btn" id="transcript">Transcript</button><label class="voice-autonext"><input id="follow" type="checkbox" checked>Follow narration</label><label class="voice-autonext"><input id="auto-next" type="checkbox">Auto-next</label></div><div id="audio-status" class="voice-status" role="status"></div></section>
<dialog id="source-dialog" aria-labelledby="source-title"><div class="explorer"><header class="explorer-header"><h2 id="source-title">Source, with context</h2><button class="btn" id="close-source">Close</button></header><div class="explorer-grid"><aside class="file-sidebar"><input id="search" class="search" type="search" aria-label="Find source file" placeholder="Find a file or concept"><nav id="files" class="file-list" aria-label="Source files"></nav></aside><section class="file-main"><div id="file-explanation" class="file-explanation"></div><div class="file-actions"><button class="btn" id="full-source">Full source</button><button class="btn" id="diff">PR changes</button></div><div id="source" class="file-code" tabindex="0" aria-label="Source code"></div></section></div></div></dialog>
<dialog id="transcript-dialog" aria-labelledby="transcript-title"><article class="transcript-content"><header><h2 id="transcript-title"></h2><button class="btn" id="close-transcript">Close</button></header><div id="transcript-body"></div></article></dialog>
<script type="application/json" id="data">__DATA__</script><script>__SCRIPT__</script></body></html>
